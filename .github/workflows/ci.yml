# CI/CD — one pipeline for every push and pull request.
#
#   checks ─┐
#   test ───┼─► image ─► deploy (production only) ─► verify
#           │
# checks   every module loads, the test manifest, ESLint (errors only)
# test     the WHOLE suite (npm run test:all) against a real Postgres, with
#          the app checked out beside it (some suites read its source)
# image    the production Docker image, built ONCE here; on production it is
#          saved as an artifact and that exact image is what deploys
# deploy   streams the tested image to the VPS (forced-command key →
#          /opt/myassistant/deploy.sh deploy-image <sha>): backup, swap,
#          /health/ready, automatic rollback
# verify   the public URL answers ready AND reports this commit's sha
#
# Deploys wait for the full suite (until 2026-11-20 they ran only the smoke
# test and did not wait for CI). security.yml runs alongside.
#
# Secrets (environment "production"): VPS_SSH_KEY, VPS_KNOWN_HOSTS. Unset →
# the deploy step says so and stops; nothing fails.
name: ci-cd
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

env:
  NODE_VERSION: 22 # matches the Dockerfile

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Every module loads
        env:
          DATABASE_URL: postgres://unused:unused@localhost:5432/unused
          JWT_SECRET: ci-only-secret-not-used-in-prod-0123456789abcdef
        run: node scripts/check-modules.js
      - name: Every test script exists
        run: npm run test:manifest

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myassistant
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: myassistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myassistant -d myassistant"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://myassistant:ci@localhost:5432/myassistant
      JWT_SECRET: ci-only-secret-not-used-in-prod-0123456789abcdef
    defaults:
      run:
        working-directory: myassistant-backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: myassistant-backend
      - uses: actions/checkout@v4
        with:
          repository: MyAssistantApps/myassistant-flutter
          # The app's live branch — the halves must agree with what ships.
          ref: production
          path: myassistant-flutter
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: myassistant-backend/package-lock.json
      - run: npm ci
      - name: Full test suite
        run: npm run test:all

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: myassistant-backend:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image boots and reports its version
        run: |
          docker network create cinet
          docker run -d --name pg --network cinet -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U ci -d ci >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name be --network cinet -p 3000:3000 \
            -e DATABASE_URL=postgres://ci:ci@pg:5432/ci -e JWT_SECRET=ci-only-secret-not-used-in-prod-0123456789abcdef \
            -e NODE_ENV=production -e ADMIN_KEY=ci-admin-key-0123456789 myassistant-backend:${{ github.sha }}
          for i in $(seq 1 60); do curl -fsS localhost:3000/health/ready 2>/dev/null && break; sleep 2; done
          curl -fsS localhost:3000/health | tee health.json
          grep -q '"version":"${{ github.sha }}"' health.json || { docker logs be | tail -50; exit 1; }
      - name: Save the image for the deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        run: docker save myassistant-backend:${{ github.sha }} | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        with:
          name: image
          path: image.tar.gz
          retention-days: 3
          compression-level: 0

  deploy:
    needs: [checks, test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewer / branch rule live on this environment (SECURITY.md).
    environment: production
    outputs:
      deployed: ${{ steps.ship.outputs.deployed }}
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Deploy to the VPS
        id: ship
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN" ]; then
            echo "::notice::VPS_SSH_KEY / VPS_KNOWN_HOSTS are not set — skipping the deploy."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            ghdeploy@189.72.146.77 "deploy-image ${{ github.sha }}" < image.tar.gz
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  verify:
    needs: [deploy]
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Production is ready and runs this commit
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -m 10 https://backend.envisionsit.in/health/ready >/dev/null; then
              v=$(curl -fsS -m 10 https://backend.envisionsit.in/health | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))')
              echo "production version: $v"
              [ "$v" = "${{ github.sha }}" ] && exit 0
            fi
            sleep 6
          done
          echo "::error::production is not ready on ${{ github.sha }}"
          exit 1
