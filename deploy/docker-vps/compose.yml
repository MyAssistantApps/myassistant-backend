services:
  backend:
    build: ./src-repo
    env_file: .env
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
  postgres:
    image: postgres:16-alpine
    env_file: pg.env
    environment: { POSTGRES_USER: myassistant, POSTGRES_DB: myassistant }
    volumes: [ "./pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myassistant -d myassistant"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: [ "80:80", "443:443" ]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
    restart: unless-stopped
