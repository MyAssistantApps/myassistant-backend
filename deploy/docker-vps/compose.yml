# Every request writes a JSON log line; Docker's default json-file driver
# never rotates, so the VPS disk would eventually fill and take Postgres
# down with it. 5 x 50 MB per container.
x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

services:
  backend:
    logging: *logging
    build: ./src-repo
    env_file: .env
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    # Room for the shutdown hook (jobs, scheduler, pool) before SIGKILL.
    stop_grace_period: 20s
    volumes:
      - ./data:/app/data
      - ./firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
  postgres:
    logging: *logging
    image: postgres:16-alpine
    env_file: pg.env
    environment: { POSTGRES_USER: myassistant, POSTGRES_DB: myassistant }
    volumes: [ "./pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myassistant -d myassistant"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  caddy:
    logging: *logging
    image: caddy:2-alpine
    ports: [ "80:80", "443:443" ]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
    restart: unless-stopped
