# MONITORING for the production VPS — Prometheus, Grafana, Loki and the
# exporters, on the same Docker network as the backend.
#
# Started together with the app stack:
#   cd /opt/myassistant
#   docker compose -f compose.yml -f monitoring/compose.monitoring.yml up -d
#
# Nothing here publishes a port. Grafana is reached through Caddy at
# https://backend.envisionsit.in/grafana/ (login: admin / GRAFANA_ADMIN_PASSWORD
# from monitoring/monitoring.env). Prometheus, Loki and the exporters are
# internal only.
#
# Memory budget (limits below): ~1.3 GB in total, sized for a small VPS.
# Retention: metrics 15 days, logs 7 days.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "3" }

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - ./monitoring-data/prometheus:/prometheus
    # The backend's /metrics needs METRICS_TOKEN (same value as in .env).
    secrets: [metrics_token]
    restart: unless-stopped
    mem_limit: 400m
    logging: *logging

  grafana:
    image: grafana/grafana:12.0.2
    env_file: monitoring/monitoring.env
    environment:
      GF_SERVER_ROOT_URL: https://backend.envisionsit.in/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_LOG_LEVEL: warn
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring-data/grafana:/var/lib/grafana
    depends_on: [prometheus, loki]
    restart: unless-stopped
    mem_limit: 300m
    logging: *logging

  loki:
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - ./monitoring-data/loki:/loki
    restart: unless-stopped
    mem_limit: 300m
    logging: *logging

  # Ships every container's stdout (the backend's JSON logs included) to Loki.
  alloy:
    image: grafana/alloy:v1.9.1
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring-data/alloy:/var/lib/alloy
    depends_on: [loki]
    restart: unless-stopped
    mem_limit: 150m
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    mem_limit: 60m
    logging: *logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    mem_limit: 150m
    logging: *logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    env_file: monitoring/monitoring.env
    depends_on: [postgres]
    restart: unless-stopped
    mem_limit: 60m
    logging: *logging

secrets:
  metrics_token:
    file: ./monitoring/metrics_token
